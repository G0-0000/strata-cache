[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-cache-plugin"
version = "0.0.1"
description = "External cache plugin for Strata - P1 read-only shadow skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strata-cache-plugin = "strata_cache_plugin.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
