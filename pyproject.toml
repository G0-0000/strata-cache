[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-cache"
version = "0.1.0"
description = "External cache service for Strata - read-only shadow and v1 store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strata-cache = "strata_cache.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
